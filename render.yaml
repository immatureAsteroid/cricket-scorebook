services:
  - type: web
    name: cricket-scorebook
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cricket-db
          property: connectionString

databases:
  - name: cricket-db
    plan: free
